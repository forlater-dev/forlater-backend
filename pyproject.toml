[project]
name = "forlater-backend"
version = "0.1.0"
description = "Forlater FastAPI backend"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "asyncpg>=0.31.0",
    "fastapi==0.142.2",
    "psycopg[binary]>=3.3.6",
    "python-dotenv==1.2.4",
    "sqlalchemy[asyncio]>=2.0.54",
    "sqlmodel>=0.0.47",
    "uvicorn[standard]==0.54.0",
    "workos==10.5.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "ruff>=0.16.10",
]
